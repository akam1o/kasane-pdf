[package]
name = "kasane-pdf"
version = "0.0.0"
edition = "2021"
rust-version = "1.70"
authors = ["akam1o <5158577+akam1o@users.noreply.github.com>"]
description = "A PDF parsing/processing engine written in Rust (early development)"
publish = false
# License is intentionally undecided. Until decided, all rights reserved.
# See docs/design.md for the dependency licensing policy.

[dependencies]
# FlateDecode (zlib/DEFLATE). flate2 = MIT or Apache-2.0; the default
# rust_backend uses miniz_oxide (MIT). No copyleft code is linked.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

# 2D raster backend for M3 rendering. BSD-3-Clause.
# Used only to rasterize paths/fills; all PDF interpretation is ours.
tiny-skia = "0.12"

# PNG encoding for M3 render output. MIT or Apache-2.0.
png = "0.18"

# JPEG (DCTDecode) decoding for image XObjects. Pure Rust,
# MIT OR Apache-2.0; `rayon` parallelism is disabled to keep the
# dependency tree small.
jpeg-decoder = { version = "0.3", default-features = false }
