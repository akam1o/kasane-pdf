[package]
name = "kasane-pdf"
version = "0.2.1"
edition = "2021"
rust-version = "1.92"
authors = ["akam1o <5158577+akam1o@users.noreply.github.com>"]
description = "Independent PDF engine: parsing, rendering, text extraction, rewriting and incremental editing with strict resource limits"
license = "Apache-2.0"
repository = "https://github.com/akam1o/kasane-pdf"
homepage = "https://github.com/akam1o/kasane-pdf"
readme = "README.md"
keywords = ["pdf", "parser", "renderer", "rasterizer", "document"]
categories = ["parser-implementations", "rendering", "text-processing", "multimedia::images"]
# What ships in the crate. An explicit list so the `cjk-fallback` assets
# — fetched into the git-ignored assets/cjk/ by scripts/fetch-cjk-assets.sh
# and verified against scripts/cjk-assets.sha256 — are packaged too; a
# crate built from crates.io with that feature must not need the network.
# The compatibility corpus tooling, its baselines and the CI definitions
# stay out.
include = [
    "/src",
    "/examples",
    "/tests",
    "/fonts",
    "/docs",
    "/assets/cjk",
    "/scripts/fetch-cjk-assets.sh",
    "/scripts/cjk-assets.sha256",
    "/Cargo.toml",
    "/README.md",
    "/LICENSE",
    "/NOTICE",
    "/CHANGELOG.md",
    "/CONTRIBUTING.md",
    "/SECURITY.md",
]

[package.metadata.docs.rs]
# Document the cjk-fallback API too; the assets ship in the crate.
all-features = true

[dependencies]
# FlateDecode (zlib/DEFLATE). flate2 = MIT or Apache-2.0; the default
# rust_backend uses miniz_oxide (MIT). No copyleft code is linked.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

# 2D raster backend for page rendering. BSD-3-Clause.
# Used only to rasterize paths/fills; all PDF interpretation is ours.
tiny-skia = "0.12"

# PNG encoding for render output. MIT or Apache-2.0.
png = "0.18"

# JPEG (DCTDecode) decoding for image XObjects. Pure Rust,
# MIT OR Apache-2.0; `rayon` parallelism is disabled to keep the
# dependency tree small.
jpeg-decoder = { version = "0.3", default-features = false }

# TrueType glyph extraction for embedded font programs.
# MIT OR Apache-2.0, zero dependencies; only glyph outlines and the
# cmap/post tables are used — no shaping (HarfBuzz is not required).
ttf-parser = { version = "0.25", default-features = false, features = ["std", "glyph-names"] }
# Apache-2.0 OR MIT, pure Rust (`#![forbid(unsafe_code)]`), no_std +
# alloc; the `simd`/`image` features stay off. JBIG2 (T.88) generic,
# refinement, symbol/text, halftone and pattern regions; MMR through
# hayro-ccitt, which also serves /CCITTFaxDecode (G3 1D/2D, G4).
hayro-jbig2 = { version = "0.3", default-features = false }
hayro-ccitt = { version = "0.4", default-features = false }
hayro-jpeg2000 = { version = "0.4", default-features = false }

[[example]]
name = "cjk_fallback"
required-features = ["cjk-fallback"]

[features]
default = ["tiny-skia-interop"]
# Expose the tiny-skia `Pixmap` behind `RenderedPage` (`pixmap()`,
# `into_pixmap()`, the `Pixmap` re-export, `pixmap_to_png`). The
# rasteriser is always tiny-skia; this feature only controls whether
# its type is part of kasane-pdf's public API, so the backend-neutral
# accessors (`pixels()`, `into_rgba8()`, `to_png()`) remain the stable
# surface. On by default.
tiny-skia-interop = []
# Bundle the Adobe-Japan1 predefined CMaps, the CID → Unicode map and a
# Japanese fallback face (assets/cjk/, fetched by scripts/fetch-cjk-assets.sh)
# so non-embedded Adobe-Japan1 CID fonts render. Off by default.
cjk-fallback = []
