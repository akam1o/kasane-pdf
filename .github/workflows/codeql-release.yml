# CodeQL on release branches. The repository's CodeQL default setup
# analyses the default branch and pull requests; a patch release cut
# from an older tag (release/v0.4.1 from v0.4.0) is neither, and an
# advanced-setup upload is rejected while default setup is enabled. So
# this job runs the same analysis (languages actions, python, rust; the
# default query suite) on the exact release commit without uploading,
# and fails if any result is not one of the repository's reviewed
# (dismissed) alerts — the same condition under which the default
# setup's check is green on the default branch. A result matches a
# dismissed alert by rule, file and the text of the flagged line and
# two lines either side (at
# the commit the alert was last seen on), so the same code on a
# shifted line still matches, as GitHub's own line-hash matching does.
name: codeql-release

on:
  push:
    branches: ["release/**"]
  workflow_dispatch:

permissions:
  contents: read
  security-events: read

jobs:
  analyze:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [actions, python, rust]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:${{ matrix.language }}
          upload: never
          output: sarif
      - name: every result is a reviewed alert
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate "repos/${GITHUB_REPOSITORY}/code-scanning/alerts?state=dismissed&per_page=100" \
            --jq '.[] | [.rule.id, .most_recent_instance.location.path, (.most_recent_instance.location.start_line | tostring), .most_recent_instance.commit_sha] | @tsv' \
            > dismissed.tsv
          python3 - <<'EOF'
          import glob, json, subprocess
          def line_at(rev, path, n):
              r = subprocess.run(["git", "show", f"{rev}:{path}"], capture_output=True, text=True)
              lines = r.stdout.splitlines() if r.returncode == 0 else []
              # The flagged line with two lines of context either side.
              if not 0 < n <= len(lines):
                  return None
              return "\n".join(l.strip() for l in lines[max(0, n - 3):n + 2])
          dismissed = set()
          for line in open("dismissed.tsv"):
              if line.strip():
                  rule, path, n, sha = line.rstrip("\n").split("\t")
                  dismissed.add((rule, path, n))
                  text = line_at(sha, path, int(n))
                  if text:
                      dismissed.add((rule, path, text))
          new, total = [], 0
          for path in glob.glob("sarif/*.sarif"):
              for run in json.load(open(path))["runs"]:
                  for r in run.get("results", []):
                      total += 1
                      loc = r["locations"][0]["physicalLocation"]
                      uri, n = loc["artifactLocation"]["uri"], loc["region"]["startLine"]
                      key = (r["ruleId"], uri, str(n))
                      text = line_at("HEAD", uri, n)
                      if key not in dismissed and (r["ruleId"], uri, text) not in dismissed:
                          new.append(key)
          print(f"{total} result(s); {len(new)} not among the {len(dismissed)} reviewed alerts")
          for k in new:
              print("UNREVIEWED:", *k)
          raise SystemExit(1 if new else 0)
          EOF
