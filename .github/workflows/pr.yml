# Pull-request gate: engine tests, formatting, lints, and a smoke-sized
# compatibility + round-trip run over the committed fixtures with a
# regression check against the committed baseline. Nothing here needs
# credentials or the real-world corpus; nothing generated is committed.
name: pr

on:
  pull_request:
  push:
    # release/** : a patch release cut from an older tag is verified on
    # its own exact commit (the pull-request path would test a merge
    # with main).
    branches: [main, "release/**"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  engine:
    name: test / fmt / clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, 2026-10-24
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: v0-baseline-miss
          # compat/runner is its own package with its own target/.
          workspaces: |
            .
            compat/runner
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - name: clippy + test (compat runner)
        working-directory: compat/runner
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test

  # The public API must be consistent whichever features are on: the
  # backend-neutral RenderedPage accessors always exist, the tiny-skia
  # interop only with its feature. Integration tests use the interop and
  # need the default features; without them the lib, bins, examples,
  # unit tests and doctests are checked. Lints/docs and tests are
  # separate jobs so they run in parallel.
  features-lint:
    name: feature matrix (clippy + docs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, 2026-10-24
        with:
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: v0-baseline-miss
      - run: cargo clippy --all-targets --features cjk-fallback -- -D warnings
      - run: cargo clippy --lib --bins --examples --no-default-features -- -D warnings
      - run: cargo clippy --lib --bins --examples --no-default-features --features cjk-fallback -- -D warnings
      - run: cargo clippy --all-targets --no-default-features --features tiny-skia-interop -- -D warnings
      - name: docs build without warnings (all features, and none)
        env:
          RUSTDOCFLAGS: -D warnings
        run: |
          cargo doc --no-deps --all-features
          cargo doc --no-deps --no-default-features

  features-test:
    name: feature matrix (tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, 2026-10-24
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: v0-baseline-miss
      - run: cargo test --features cjk-fallback
      - run: cargo test --no-default-features --lib
      - run: cargo test --no-default-features --doc
      - run: cargo test --no-default-features --features cjk-fallback --lib
      - run: cargo test --no-default-features --features cjk-fallback --doc

  render-fuzz-smoke:
    # The structured render fuzz targets (v0.5.1 R4) and the redaction
    # model (v0.10, a false success is a failure): the committed seeds
    # replayed (the same inputs every run), then 3000 new inputs from
    # libFuzzer seed 1 (bounded in count and time; which inputs it reaches
    # can vary, since coverage feedback depends on the library's hash
    # order). A failure uploads the input, whose result is deterministic.
    # fuzz/ci-run.sh fails on the exit status, saved inputs, error markers
    # or a missing final line; the seed replay also reports, per page,
    # whether rendering painted, and painted pages are required.
    # Minutes, no corpus; long runs are fuzz-nightly.yml.
    name: render fuzz smoke (seeds, fixed seed)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, 2026-10-24
        with:
          toolchain: nightly-2026-10-29
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: v0-baseline-miss
          workspaces: fuzz
      - run: cargo install cargo-fuzz --locked --version 0.13.2
      - name: build
        working-directory: fuzz
        run: |
          cargo +nightly-2026-10-29 fuzz build -O render_content
          cargo +nightly-2026-10-29 fuzz build -O render_graph
          cargo +nightly-2026-10-29 fuzz build -O redact_model
      - name: replay the seeds; the pages they render must paint
        run: |
          for t in render_content render_graph; do
            KASANE_FUZZ_REACH="/tmp/reach-$t" fuzz/ci-run.sh "$t" "fuzz/seeds/$t" -- -runs=0
            echo "$t pages:"; sort "/tmp/reach-$t" | uniq -c | sort -rn
            grep -q "^ok painted" "/tmp/reach-$t" || { echo "::error::$t seeds painted nothing"; exit 1; }
          done
          # The redaction model: a false success fails as a crash.
          fuzz/ci-run.sh redact_model fuzz/seeds/redact_model -- -runs=0
      - name: 3000 new inputs per target (libFuzzer seed 1, at most 180 s each)
        run: |
          for t in render_content render_graph redact_model; do
            mkdir -p "/tmp/corpus-$t" && cp "fuzz/seeds/$t"/* "/tmp/corpus-$t/"
            fuzz/ci-run.sh "$t" "/tmp/corpus-$t" -- -seed=1 -runs=3000 -max_total_time=180 || exit 1
          done
      - name: crash inputs (synthetic documents, no corpus content)
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: render-fuzz-smoke-artifacts
          path: fuzz/artifacts
          retention-days: 7
          if-no-files-found: ignore

  r2-depth-linux:
    # max_xobject_depth (v0.5.1 R2) on Linux x86_64: the boundary tests in
    # debug and release builds — 47/48 render and 49 is refused on every
    # nesting path, cycles stop, a refusal leaves the document rendering,
    # the default depth fits a 2 MiB (debug) / 512 KiB (release) thread
    # and a 64 KiB one overflows, each in a child process — then the
    # smallest stack each path needs, measured (reported, not a check).
    name: R2 depth and stack (linux, debug + release)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, 2026-10-24
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: v0-baseline-miss
      - run: cargo test --test render_xobject_depth
      - run: cargo test --release --test render_xobject_depth
      - name: stack per nesting path (debug, release)
        run: |
          cargo test --test render_xobject_depth -- --ignored --nocapture --exact measure_stack_per_path
          cargo test --release --test render_xobject_depth -- --ignored --nocapture --exact measure_stack_per_path

  wasm:
    name: wasm32 build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, 2026-10-24
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: v0-baseline-miss
      - run: cargo build --lib --target wasm32-unknown-unknown
      - run: cargo build --lib --target wasm32-unknown-unknown --features cjk-fallback
      - run: cargo build --lib --target wasm32-unknown-unknown --no-default-features

  audit:
    name: dependency audit (RustSec)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # A prebuilt cargo-audit: building it from source took ~3 min and
      # was the slowest step of the whole gate.
      - uses: taiki-e/install-action@1919c4a95903d2c33e4a221102edca87309fc14b # v2.89.0
        with:
          tool: cargo-audit
      # Reads .cargo/audit.toml: the only ignored id is the informational
      # unmaintained notice for ttf-parser (docs/decisions/ttf-parser.md);
      # any vulnerability advisory fails this job.
      - run: cargo audit
      - name: audit the compatibility runner too
        working-directory: compat/runner
        run: cargo audit

  crate-package:
    name: crate package check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, 2026-10-24
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: v0-baseline-miss
      - name: committed cjk assets match the lock
        run: ./scripts/fetch-cjk-assets.sh --check
      - name: package from the clean tree (verifies the default build)
        run: cargo package
      - name: the packaged crate builds and tests on its own, default and cjk-fallback
        # Reuse the cached target/ for the dependencies; the crate itself
        # is still compiled from the extracted package sources.
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
        run: |
          set -e
          crate=$(ls target/package/kasane-pdf-*.crate)
          echo "crate: $crate ($(stat -c %s "$crate") bytes)"
          mkdir -p /tmp/crate && tar -xzf "$crate" -C /tmp/crate
          dir=$(ls -d /tmp/crate/kasane-pdf-*)
          test -f "$dir/assets/cjk/NotoSansJP-Regular.otf"
          test -f "$dir/LICENSE" && test -f "$dir/NOTICE"
          cd "$dir"
          cargo build --release --features cjk-fallback --examples
          cargo test --features cjk-fallback
          cargo doc --no-deps --all-features
          grep -q '"sha1"' .cargo_vcs_info.json

  compat-smoke:
    name: compat + round-trip smoke (fixtures)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, 2026-10-24
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: v0-baseline-miss
          workspaces: compat/runner
      - name: external verifiers (qpdf, poppler)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends qpdf poppler-utils poppler-data
      - name: build runner
        working-directory: compat/runner
        run: cargo build --release
      - name: workflow / corpus-tool consistency (no credentials needed)
        run: |
          pip3 install --quiet pyyaml
          python3 scripts/check-workflows.py
          python3 compat/fetch-corpus.py list > /dev/null
      - name: smoke run over tests/fixtures
        run: |
          mkdir -p /tmp/smoke
          ./compat/runner/target/release/kasane-compat run \
            --corpus tests/fixtures --out /tmp/smoke \
            --with-poppler --mode smoke
      - name: quality-gate unit tests
        run: python3 scripts/test_ci_regression.py
      - name: usage-rights removal audited by qpdf and pypdf (synthetic form, no corpus)
        run: |
          pip3 install --quiet pypdf==6.21.4
          python3 scripts/usage-rights-audit.py --self-test
      - name: redaction checked by qpdf and pdftotext (synthetic cases, no corpus)
        run: |
          cargo build --release --bin kasane-pdf
          python3 scripts/verify-redact.py target/release/kasane-pdf
      - name: advisory regressions checked by qpdf and pdftotext (synthetic inputs)
        run: |
          KASANE_ADVISORY_DUMP=/tmp/advisories cargo test --release --test redact_advisories
          python3 scripts/check-advisory-regressions.py target/release/kasane-pdf /tmp/advisories --expect-safe
      - name: regression check vs committed baseline
        run: |
          python3 scripts/ci-regression.py check /tmp/smoke/latest.json compat/baselines/fixtures-smoke.json \
            --summary-md "$GITHUB_STEP_SUMMARY"
      - name: upload report (markdown + json, no images)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: compat-smoke-report
          path: |
            /tmp/smoke/latest.md
            /tmp/smoke/latest.json
          retention-days: 14
