# Pull-request gate: engine tests, formatting, lints, and a smoke-sized
# compatibility + round-trip run over the committed fixtures with a
# regression check against the committed baseline. Nothing here needs
# credentials or the real-world corpus; nothing generated is committed.
name: pr

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  engine:
    name: test / fmt / clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, 2026-10-24
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - name: clippy + test (compat runner)
        working-directory: compat/runner
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test

  crate-package:
    name: crate package check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, 2026-10-24
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: committed cjk assets match the lock
        run: ./scripts/fetch-cjk-assets.sh --check
      - name: package from the clean tree (verifies the default build)
        run: cargo package
      - name: the packaged crate builds and tests on its own, default and cjk-fallback
        run: |
          set -e
          crate=$(ls target/package/kasane-pdf-*.crate)
          echo "crate: $crate ($(stat -c %s "$crate") bytes)"
          mkdir -p /tmp/crate && tar -xzf "$crate" -C /tmp/crate
          dir=$(ls -d /tmp/crate/kasane-pdf-*)
          test -f "$dir/assets/cjk/NotoSansJP-Regular.otf"
          test -f "$dir/LICENSE" && test -f "$dir/NOTICE"
          cd "$dir"
          cargo build --release --features cjk-fallback --examples
          cargo test --features cjk-fallback
          cargo doc --no-deps --all-features
          grep -q '"sha1"' .cargo_vcs_info.json

  compat-smoke:
    name: compat + round-trip smoke (fixtures)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, 2026-10-24
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: external verifiers (qpdf, poppler)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends qpdf poppler-utils
      - name: build runner
        working-directory: compat/runner
        run: cargo build --release
      - name: workflow / corpus-tool consistency (no credentials needed)
        run: |
          pip3 install --quiet pyyaml
          python3 scripts/check-workflows.py
          python3 compat/fetch-corpus.py list > /dev/null
      - name: smoke run over tests/fixtures
        run: |
          mkdir -p /tmp/smoke
          ./compat/runner/target/release/kasane-compat run \
            --corpus tests/fixtures --out /tmp/smoke \
            --with-poppler --mode smoke
      - name: regression check vs committed baseline
        run: python3 scripts/ci-regression.py check /tmp/smoke/latest.json compat/baselines/fixtures-smoke.json
      - name: upload report (markdown + json, no images)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: compat-smoke-report
          path: |
            /tmp/smoke/latest.md
            /tmp/smoke/latest.json
          retention-days: 14
