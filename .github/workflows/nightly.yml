# Nightly / on-demand: the full real-world corpus (511 files) — strict
# and recovery parse, render, text, rewrite, every-page round-trip with
# Poppler and qpdf verification, visual fidelity, performance and the
# robustness set — and the redaction corpus (117 runs in four option
# sets, scripts/eval-redact-corpus.py) compared with the committed
# results in compat/redaction/. Dispatched on a release commit, this is
# the corpus part of the release gate (docs/releasing.md). The engine
# tests with cjk-fallback run on every push in pr.yml.
#
# The corpus lives in a private object store. Its credentials are
# repository secrets that are only exposed to this workflow, never to
# pull-request runs, and the job is skipped entirely when they are not
# configured (forks). Files that cannot be redistributed never leave the
# store; only aggregate reports (markdown + json) are uploaded as
# artifacts — no PDFs, no rendered images, no diff images.
name: nightly

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      reference_profile:
        # The Poppler reference's fonts (docs/courier-reference.md): e1,
        # the baseline's, for every scheduled run; e0 (the runner's own
        # fonts) for an evaluation run only — its environment fingerprint
        # differs from the baseline's, so its numeric check fails.
        description: "reference profile (e1: the baseline's; e0: evaluation only)"
        required: false
        default: e1
        type: choice
        options: [e1, e0]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  full-corpus:
    name: full compatibility + round-trip (511)
    runs-on: ubuntu-latest
    timeout-minutes: 180
    # Secrets are not available to expressions in `if`; gate on a
    # repository variable the maintainers set alongside the secrets.
    if: ${{ vars.KASANE_CORPUS_ENABLED == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, 2026-10-24
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # A run dispatched on another branch reads main's cache only.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: external verifiers (qpdf, Poppler; MuPDF and Pillow for the second witness)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qpdf poppler-utils poppler-data python3-pip \
            mupdf-tools python3-pil
      # Poppler's reference fonts: E1 — the runner's own, but Courier and
      # Courier New (only) drawn with Nimbus Mono PS, through a private
      # fontconfig configuration and wrappers that only the reference
      # steps put first on PATH (kasane reads no fontconfig; MuPDF draws
      # with its built-in fonts). probe.py fails unless E1 changes those
      # families alone. The environment fingerprint records the profile,
      # the effective configuration and the fonts.
      - name: reference fonts (E1 — Courier and Courier New to Nimbus Mono PS, Poppler only)
        env:
          PROFILE: ${{ inputs.reference_profile || 'e1' }}
        run: |
          case "$PROFILE" in
            e1)
              sh scripts/courier-reference/setup-e1.sh /tmp/ref
              python3 scripts/courier-reference/probe.py /tmp/ref --json /tmp/ref-probe.json
              echo "REFERENCE_BIN=/tmp/ref/bin" >> "$GITHUB_ENV" ;;
            e0) echo "REFERENCE_BIN=" >> "$GITHUB_ENV" ;;
            *) echo "::error::unknown reference profile $PROFILE"; exit 1 ;;
          esac
      - name: CJK fallback assets (committed; verified against the lock)
        run: ./scripts/fetch-cjk-assets.sh --check
      - name: build runner (with cjk-fallback)
        working-directory: compat/runner
        run: cargo build --release --features cjk-fallback
      - name: fetch corpus from the private store
        # fetch-corpus.py reads the store location from
        # KASANE_CORPUS_ENDPOINT / KASANE_CORPUS_BUCKET and lets boto3
        # pick the credentials up from the standard AWS_* variables;
        # the repository secrets keep their KASANE_R2_* names. Every
        # downloaded file is checked against the manifest's SHA-256.
        env:
          KASANE_CORPUS_ENDPOINT: ${{ secrets.KASANE_R2_ENDPOINT }}
          KASANE_CORPUS_BUCKET: ${{ secrets.KASANE_R2_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.KASANE_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.KASANE_R2_SECRET_ACCESS_KEY }}
          AWS_REGION: auto
        run: |
          pip3 install --quiet boto3 pyyaml
          python3 compat/fetch-corpus.py download --dir compat/corpus
      - name: redaction corpus — four option sets vs compat/redaction (ids and counts only)
        # A run the committed results have `ok` that is not `ok` now, an
        # unexpected run other than the known zeroed-image signal, or more
        # text lost outside the rects fails (scripts/check-redact-corpus.py).
        # The raw results (rects, refusal details) never leave the runner:
        # only their projection (scripts/redact-results-projection.py —
        # ids, categories, counts) is compared and uploaded.
        run: |
          sudo apt-get install -y --no-install-recommends mupdf-tools
          cargo build --release --bin kasane-pdf
          k=target/release/kasane-pdf
          a="--redact-arg --embed-substitute-fonts --redact-arg --remove-annotations"
          set -- \
            "default|" \
            "optin|$a" \
            "optin-javascript|$a --redact-arg --remove-javascript" \
            "optin-strict|$a --redact-arg --remove-javascript --redact-arg --refuse-uninspected"
          # The runner's Poppler and MuPDF shift word and pixel counts:
          # compare with results measured on the runner when committed.
          base=compat/redaction/ci; [ -d "$base" ] || base=compat/redaction
          mkdir -p /tmp/redact-projection
          failed=0
          for c in "$@"; do
            name=${c%%|*}; args=${c#*|}
            # Exit status 1 means a run is `unexpected` (the known
            # zeroed-image signal included): the comparison decides. Any
            # other status, or no results, is a failure.
            if python3 scripts/eval-redact-corpus.py "$k" --json "/tmp/redact-$name.json" $args > "/tmp/redact-$name.txt" 2>&1; then
              rc=0
            else
              rc=$?
            fi
            if [ "$rc" -gt 1 ] || [ ! -s "/tmp/redact-$name.json" ]; then
              echo "::error::eval-redact-corpus failed ($name, status $rc)"
              failed=1
              continue
            fi
            if ! python3 scripts/redact-results-projection.py "/tmp/redact-$name.json" "/tmp/redact-projection/eval-$name.json"; then
              echo "::error::projection failed ($name)"
              failed=1
              continue
            fi
            python3 scripts/check-redact-corpus.py "$name" "/tmp/redact-projection/eval-$name.json" \
              --baseline "$base" --summary-md "$GITHUB_STEP_SUMMARY" || failed=1
          done
          exit $failed
      - name: full run (all pages, Poppler witness, external checks)
        # The default rewrite is the enforced run. `--rewrite-options
        # carry` also measures `rewrite_with` under
        # ExecutableContentPolicy::Carry in its own namespace
        # (`rewrite_options.carry`, `by_config.carry`); the check never
        # enforces it.
        run: |
          mkdir -p /tmp/full
          PATH="${REFERENCE_BIN:+$REFERENCE_BIN:}$PATH" ./compat/runner/target/release/kasane-compat run \
            --corpus compat/corpus --out /tmp/full \
            --with-poppler --dpi 96 --timeout-secs 20 --mode full \
            --rewrite-options carry
      - name: second witness and 300 dpi re-check of the pages below SSIM 0.95 (M1-a, M1-b)
        # Every strict-render page below 0.95 — all of them, no cap per
        # file (M2) — is rendered again by kasane (the CLI built with the
        # runner's features), Poppler and MuPDF, at 72 and 300 dpi
        # (docs/compat-evaluation.md). The environment (commit, platform,
        # renderer versions) goes with the results. Beyond
        # --max-pages-total the rest is recorded as truncated, and the
        # check fails on it.
        run: |
          cargo build --release --features cjk-fallback --bin kasane-pdf --target-dir target/cjk
          export PATH="${REFERENCE_BIN:+$REFERENCE_BIN:}$PATH"
          python3 scripts/ci-regression.py env --features cjk-fallback > /tmp/full/env.json
          python3 scripts/compat-attribute.py /tmp/full/latest.json target/cjk/release/kasane-pdf \
            --out /tmp/full/attribution.json --summary /tmp/full/attribution-summary.json \
            --features cjk-fallback --jobs 4
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          s = json.load(open("/tmp/full/attribution-summary.json"))
          print(f"## Second witness: {s['pages']} pages of {s['files']} files below SSIM {s['threshold']}\n")
          print("| agreement at 300 dpi | pages |\n|---|---:|")
          for k, v in s["agreement"].items():
              print(f"| {k} | {v} |")
          print(f"\nreferences disagree: {s['references_disagree']}; Poppler {s['env']['poppler']}, MuPDF {s['env']['mupdf']}\n")
          if s.get("truncated"):
              print(f"**{s['truncated']} page(s) below the threshold not measured (--max-pages-total)**\n")
          PY
      # E1 against E0 on every page Poppler draws: a page E1 changes must
      # be one of a file whose Courier face it replaced (fails otherwise).
      - name: the reference profile changes Courier pages only (E0 vs E1, ids and counts)
        if: env.REFERENCE_BIN != ''
        run: python3 scripts/courier-reference/reference-diff.py compat/corpus /tmp/ref --json /tmp/full/reference-diff.json
      - name: regression check and exact-render quality gate vs committed 511 baseline
        # Fails on any stage / round-trip regression, on a new
        # quality-gate flag (compat/quality-gate.json), on a file missing
        # from the run, and — against a baseline of the same environment
        # (--require-same-env) — on a page SSIM, content SSIM or text F1
        # drop, a page no longer compared, and a page that leaves the
        # witnesses' tolerance or becomes not comparable (M1-c). The
        # gate's counts go to the job summary.
        run: |
          python3 scripts/ci-regression.py check /tmp/full/latest.json compat/baselines/corpus-full.json \
            --env /tmp/full/env.json --attribution /tmp/full/attribution.json --require-same-env \
            --summary-md "$GITHUB_STEP_SUMMARY"
      - name: redaction corpus results (projection — ids, categories, counts)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: redaction-corpus-projection
          path: /tmp/redact-projection/*.json
          retention-days: 14
          if-no-files-found: ignore
      - name: per-category quality tables (aggregates only)
        if: always()
        run: python3 scripts/quality-by-category.py /tmp/full/latest.json >> "$GITHUB_STEP_SUMMARY"
      - name: upload aggregate report (no PDFs, no images)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: compat-full-report
          path: |
            /tmp/full/latest.md
            /tmp/full/latest.json
            /tmp/full/env.json
            /tmp/full/attribution.json
            /tmp/full/attribution-summary.json
            /tmp/full/reference-diff.json
            /tmp/ref-probe.json
          retention-days: 30

  # Every published version of compat/advisories/history.json built from
  # its crates.io package (checksum against the index, contents against
  # the git tag, --locked, toolchain 1.92, default features) and run on
  # the advisory regression inputs of tests/redact_advisories.rs (synthetic,
  # committed): each affected version must still LEAK, the candidate (this
  # commit) must be removed / refused / kept as history.json expects, each
  # advisory's range as published (scripts/advisory-history.py). Text
  # cases are judged by Poppler, MuPDF and pdf.js. No credentials, no
  # corpus, no private input (the script refuses them in Actions); the
  # uploaded JSON names synthetic inputs, versions and digests.
  advisory-history:
    name: advisory history (published versions, linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The tags: each package is checked against its tag's commit.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, 2026-10-24
        with:
          toolchain: "1.92"
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, 2026-10-24
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: renderers (Poppler, MuPDF, qpdf from apt; pdf.js pinned in tools/pdfjs)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils mupdf-tools qpdf
          npm ci --no-audit --no-fund --prefix tools/pdfjs
      - name: published versions built before (each binary checked against its record)
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/kasane-pdf/advisory-history
          key: advisory-history-${{ runner.os }}-${{ hashFiles('compat/advisories/history.json') }}-${{ github.run_id }}
          restore-keys: advisory-history-${{ runner.os }}-${{ hashFiles('compat/advisories/history.json') }}-
      - name: the candidate and the advisory inputs
        run: |
          cargo build --locked --release --bin kasane-pdf
          KASANE_ADVISORY_DUMP=/tmp/advisories cargo test --locked --release --test redact_advisories
      # The mode is the ref's, never guessed: a branch is judged against
      # every published version (main); a vX.Y.Z tag against its own
      # history, the versions published after it listed as not judged
      # (release-tag); any other ref fails.
      - name: every published version and the candidate, judged
        run: |
          case "$GITHUB_REF" in
            refs/heads/*) mode="--mode main" ;;
            refs/tags/v*)
              v="${GITHUB_REF#refs/tags/v}"
              if ! printf '%s\n' "$v" | grep -Eqx '[0-9]+\.[0-9]+\.[0-9]+' \
                || ! grep -Eqx "version = \"$v\"" Cargo.toml; then
                echo "::error::$GITHUB_REF is not a release tag of this package"
                exit 1
              fi
              mode="--mode release-tag --tag-version $v" ;;
            *) echo "::error::cannot tell a branch from a release tag: $GITHUB_REF"; exit 1 ;;
          esac
          python3 scripts/advisory-history.py run --dump /tmp/advisories --candidate target/release/kasane-pdf $mode \
            --json /tmp/advisory-history.json
      - name: keep the builds for the next run (main only)
        if: success() && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/kasane-pdf/advisory-history
          key: advisory-history-${{ runner.os }}-${{ hashFiles('compat/advisories/history.json') }}-${{ github.run_id }}
      - name: results (synthetic inputs, versions, digests)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: advisory-history
          path: /tmp/advisory-history.json
          retention-days: 30
          if-no-files-found: ignore
