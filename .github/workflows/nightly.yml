# Nightly / on-demand: the full real-world corpus (511 files) — strict
# and recovery parse, render, text, rewrite, every-page round-trip with
# Poppler and qpdf verification, visual fidelity, performance and the
# robustness set — and the redaction corpus (117 runs in four option
# sets, scripts/eval-redact-corpus.py) compared with the committed
# results in compat/redaction/. Dispatched on a release commit, this is
# the corpus part of the release gate (docs/releasing.md). The engine
# tests with cjk-fallback run on every push in pr.yml.
#
# The corpus lives in a private object store. Its credentials are
# repository secrets that are only exposed to this workflow, never to
# pull-request runs, and the job is skipped entirely when they are not
# configured (forks). Files that cannot be redistributed never leave the
# store; only aggregate reports (markdown + json) are uploaded as
# artifacts — no PDFs, no rendered images, no diff images.
name: nightly

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  full-corpus:
    name: full compatibility + round-trip (511)
    runs-on: ubuntu-latest
    timeout-minutes: 180
    # Secrets are not available to expressions in `if`; gate on a
    # repository variable the maintainers set alongside the secrets.
    if: ${{ vars.KASANE_CORPUS_ENABLED == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, 2026-10-24
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # A run dispatched on another branch reads main's cache only.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: external verifiers (qpdf, poppler)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends qpdf poppler-utils poppler-data python3-pip
      - name: CJK fallback assets (committed; verified against the lock)
        run: ./scripts/fetch-cjk-assets.sh --check
      - name: build runner (with cjk-fallback)
        working-directory: compat/runner
        run: cargo build --release --features cjk-fallback
      - name: fetch corpus from the private store
        # fetch-corpus.py reads the store location from
        # KASANE_CORPUS_ENDPOINT / KASANE_CORPUS_BUCKET and lets boto3
        # pick the credentials up from the standard AWS_* variables;
        # the repository secrets keep their KASANE_R2_* names. Every
        # downloaded file is checked against the manifest's SHA-256.
        env:
          KASANE_CORPUS_ENDPOINT: ${{ secrets.KASANE_R2_ENDPOINT }}
          KASANE_CORPUS_BUCKET: ${{ secrets.KASANE_R2_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.KASANE_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.KASANE_R2_SECRET_ACCESS_KEY }}
          AWS_REGION: auto
        run: |
          pip3 install --quiet boto3 pyyaml
          python3 compat/fetch-corpus.py download --dir compat/corpus
      - name: redaction corpus — four option sets vs compat/redaction (ids and counts only)
        # A run the committed results have `ok` that is not `ok` now, an
        # unexpected run other than the known zeroed-image signal, or more
        # text lost outside the rects fails (scripts/check-redact-corpus.py).
        # The raw results (rects, refusal details) never leave the runner:
        # only their projection (scripts/redact-results-projection.py —
        # ids, categories, counts) is compared and uploaded.
        run: |
          sudo apt-get install -y --no-install-recommends mupdf-tools
          cargo build --release --bin kasane-pdf
          k=target/release/kasane-pdf
          a="--redact-arg --embed-substitute-fonts --redact-arg --remove-annotations"
          set -- \
            "default|" \
            "optin|$a" \
            "optin-javascript|$a --redact-arg --remove-javascript" \
            "optin-strict|$a --redact-arg --remove-javascript --redact-arg --refuse-uninspected"
          # The runner's Poppler and MuPDF shift word and pixel counts:
          # compare with results measured on the runner when committed.
          base=compat/redaction/ci; [ -d "$base" ] || base=compat/redaction
          mkdir -p /tmp/redact-projection
          failed=0
          for c in "$@"; do
            name=${c%%|*}; args=${c#*|}
            # Exit status 1 means a run is `unexpected` (the known
            # zeroed-image signal included): the comparison decides. Any
            # other status, or no results, is a failure.
            if python3 scripts/eval-redact-corpus.py "$k" --json "/tmp/redact-$name.json" $args > "/tmp/redact-$name.txt" 2>&1; then
              rc=0
            else
              rc=$?
            fi
            if [ "$rc" -gt 1 ] || [ ! -s "/tmp/redact-$name.json" ]; then
              echo "::error::eval-redact-corpus failed ($name, status $rc)"
              failed=1
              continue
            fi
            if ! python3 scripts/redact-results-projection.py "/tmp/redact-$name.json" "/tmp/redact-projection/eval-$name.json"; then
              echo "::error::projection failed ($name)"
              failed=1
              continue
            fi
            python3 scripts/check-redact-corpus.py "$name" "/tmp/redact-projection/eval-$name.json" \
              --baseline "$base" --summary-md "$GITHUB_STEP_SUMMARY" || failed=1
          done
          exit $failed
      - name: full run (all pages, Poppler witness, external checks)
        # The default rewrite is the enforced run. `--rewrite-options
        # carry` also measures `rewrite_with` under
        # ExecutableContentPolicy::Carry in its own namespace
        # (`rewrite_options.carry`, `by_config.carry`); the check never
        # enforces it.
        run: |
          mkdir -p /tmp/full
          ./compat/runner/target/release/kasane-compat run \
            --corpus compat/corpus --out /tmp/full \
            --with-poppler --dpi 96 --timeout-secs 20 --mode full \
            --rewrite-options carry
      - name: regression check and exact-render quality gate vs committed 511 baseline
        # Fails on any stage / round-trip regression and on a new
        # quality-gate flag (compat/quality-gate.json); the gate's counts
        # go to the job summary.
        run: |
          python3 scripts/ci-regression.py check /tmp/full/latest.json compat/baselines/corpus-full.json \
            --summary-md "$GITHUB_STEP_SUMMARY"
      - name: redaction corpus results (projection — ids, categories, counts)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: redaction-corpus-projection
          path: /tmp/redact-projection/*.json
          retention-days: 14
          if-no-files-found: ignore
      - name: per-category quality tables (aggregates only)
        if: always()
        run: python3 scripts/quality-by-category.py /tmp/full/latest.json >> "$GITHUB_STEP_SUMMARY"
      - name: upload aggregate report (no PDFs, no images)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: compat-full-report
          path: |
            /tmp/full/latest.md
            /tmp/full/latest.json
          retention-days: 30
