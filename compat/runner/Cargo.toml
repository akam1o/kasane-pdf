[package]
name = "kasane-compat"
version = "0.0.0"
edition = "2021"
publish = false
license = "Apache-2.0"
repository = "https://github.com/akam1o/kasane-pdf"
description = "Compatibility-test runner for kasane-pdf (dev tool; not part of the engine)"

[dependencies]
kasane-pdf = { path = "../.." }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# SHA-256 of input/output PDFs for content comparison in reports.
sha2 = "0.10"
# max-RSS sampling on Unix via getrusage.
libc = "0.2"

[features]
cjk-fallback = ["kasane-pdf/cjk-fallback"]
