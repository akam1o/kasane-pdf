# cargo-nextest profiles (CI: `cargo nextest run --profile ci`). nextest
# runs each test in its own process, binaries in parallel; doctests are
# not run by it (CI runs `cargo test --doc` beside it).

[profile.ci]
# Every failure is reported, not only the first.
fail-fast = false
failure-output = "immediate-final"
# A test is reported slow after 60 s and killed — a failure — after
# 10 min (the slowest test takes seconds).
slow-timeout = { period = "60s", terminate-after = 10 }
# No retries: a test that fails once is a failure, never a flaky pass.
retries = 0

[profile.ci.junit]
path = "junit.xml"
